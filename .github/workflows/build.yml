name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to build-output branch
        run: |
          mkdir -p /tmp/apk-publish
          cp app/build/outputs/apk/debug/*.apk /tmp/apk-publish/app-debug.apk
          git config user.name "KoznovaAV"
          git config user.email "alinakoznova78@gmail.com"
          git checkout --orphan build-output
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apk-publish/app-debug.apk ./app-debug.apk
          git add app-debug.apk
          git commit -m "Build output: app-debug.apk"
          git push origin build-output --force
